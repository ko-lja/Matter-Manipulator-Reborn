plugins {
    id "java-library"
    id "eclipse"
    id "idea"
    id "maven-publish"
    id "net.neoforged.moddev.legacyforge" version "2.0.86"
}

def modVersion = mod_version
def releaseTag = providers.environmentVariable("RELEASE_TAG").orNull
if (releaseTag) {
    def match = releaseTag =~ /^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)\+(.+)$/
    if (!match.matches() || match.group(2) != minecraft_version) {
        throw new GradleException("Release tag $releaseTag must look like v<version>+$minecraft_version")
    }
    modVersion = match.group(1)
}

group = mod_group_id
version = "${modVersion}+${minecraft_version}"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
    exclude ".cache"
}

sourceSets {
    gtm7 {
        compileClasspath += main.output + main.compileClasspath
    }
    gtm8 {
        compileClasspath += main.output + main.compileClasspath
    }
    main.runtimeClasspath += gtm7.output + gtm8.output
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gtm7)
            sourceSet(sourceSets.gtm8)
        }
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.main
            gameDirectory.set(file("run/client"))
        }

        server {
            server()
            sourceSet = sourceSets.main
            gameDirectory.set(file("run/server"))
            programArgument("--nogui")
        }

        data {
            data()
            sourceSet = sourceSets.main
            gameDirectory.set(file("run/data"))
            programArguments.addAll("--mod", mod_id)
            programArguments.addAll("--all")
            programArguments.addAll("--output", file("src/generated/resources/").absolutePath)
            programArguments.addAll("--existing", file("src/main/resources/").absolutePath)
        }

        configureEach {
            systemProperty("forge.logging.markers", "REGISTRIES")
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

obfuscation {
    createRemappingConfiguration(configurations.gtm7CompileOnly)
    createRemappingConfiguration(configurations.gtm8CompileOnly)
}

repositories {
    maven {
        url = uri("https://cursemaven.com")
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = uri("https://modmaven.dev/")
        content {
            includeGroup "appeng"
        }
    }
    maven {
        name = "GTCEu Maven"
        url = uri("https://maven.gtceu.com")
        content {
            includeGroup "com.gregtechceu.gtceu"
            includeGroup "brachy.modularui"
        }
    }
    maven {
        name = "FirstDarkDev"
        url = uri("https://maven.firstdarkdev.xyz/snapshots")
    }
    maven {
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = uri("https://maven.covers1624.net")
        content {
            includeGroup "mrtjp"
            includeGroup "io.codechicken"
        }
    }
    maven {
        url = uri("https://repo.expandium.net/releases")
    }
}

dependencies {
    // we don't want need other mods in our data run
    def dataRun = gradle.startParameter.taskNames.any { it.toLowerCase().contains("rundata") }
    def implement = { String mod ->
        modCompileOnly(mod) { transitive = false }
        if (!dataRun) {
            modRuntimeOnly(mod) { transitive = false }
        }
    }

    compileOnly "org.projectlombok:lombok:1.18.32"
    annotationProcessor "org.projectlombok:lombok:1.18.32"

    implement("appeng:appliedenergistics2-forge:15.4.10")
    implement "curse.maven:guideme-1173950:6489464"

    modGtm7CompileOnly("com.gregtechceu.gtceu:gtceu-1.20.1:$gtceu_version") { transitive = false }
    modGtm7CompileOnly("com.lowdragmc.ldlib:ldlib-forge-1.20.1:$ldlib_version") { transitive = false }
    modGtm8CompileOnly("com.gregtechceu.gtceu:gtceu-1.20.1:$gtceu8_version") { transitive = false }
    modGtm8CompileOnly("brachy.modularui:modularui-mc1.20.1:$gtceu8_modularui_version") { transitive = false }
    if (!dataRun) {
        modRuntimeOnly("com.gregtechceu.gtceu:gtceu-1.20.1:$gtceu_version") { transitive = false }
        modRuntimeOnly("com.lowdragmc.ldlib:ldlib-forge-1.20.1:$ldlib_version") { transitive = false }
    }
    jarJar(modApi("com.tterrag.registrate:Registrate:MC1.20-1.3.11"))

    implement("curse.maven:flux-networks-248020:5234697")
    implement("curse.maven:framedblocks-441647:7386520")
    implement("curse.maven:laserio-626839:5074767")
    implement("io.codechicken:CodeChickenLib:1.20.1-4.4.0.528:universal")
    implement("io.codechicken:CBMultipart:1.20.1-3.3.0.159:universal")
    implement("mrtjp:ProjectRed:1.20.1-4.21.0:core")
    implement("mrtjp:ProjectRed:1.20.1-4.21.0:integration")
    implement("mrtjp:ProjectRed:1.20.1-4.21.0:transmission")
    implement("mrtjp:ProjectRed:1.20.1-4.21.0:illumination")
    implement("mrtjp:ProjectRed:1.20.1-4.21.0:expansion")
    implement("mrtjp:ProjectRed:1.20.1-4.21.0:fabrication")
    implement("mrtjp:ProjectRed:1.20.1-4.21.0:exploration")
    implement("curse.maven:creativecore-257814:8304882")
    implement("curse.maven:littletiles-257818:6610285")
    implement("curse.maven:domum-ornamentum-527361:7585567")
    implement("curse.maven:rechiseled-558998:8301383")
    implement("curse.maven:supermartijn642s-core-lib-454372:7521769")
    implement("curse.maven:supermartijn642s-config-lib-438332:4715408")
    implement("maven.modrinth:fusion-connected-textures:1.3.1-forge-mc1.20.1")

    compileOnly 'org.jetbrains:annotations:26.1.0'

    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.5"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.5"))

    compileOnly(annotationProcessor("lu.kolja:mixinloadconditions-common:0.2.0"))
    implementation(jarJar("lu.kolja:mixinloadconditions-forge:0.2.0"))
}

["gtm7", "gtm8"].each { adapter ->
    def namedJar = tasks.register("${adapter}Jar", Jar) {
        from sourceSets[adapter].output
        archiveClassifier = adapter
        destinationDirectory = layout.buildDirectory.dir("adapters")
    }
    def remappedJar = tasks.register("reobf${adapter.capitalize()}Jar", net.neoforged.moddevgradle.legacyforge.tasks.RemapJar) {
        input = namedJar.flatMap { it.archiveFile }
        libraries.from(sourceSets[adapter].compileClasspath)
        archiveClassifier = "${adapter}-reobf"
        destinationDirectory = layout.buildDirectory.dir("adapters")
        obfuscation.configureNamedToSrgOperation(remapOperation)
    }
    tasks.named("jar", Jar) {
        from(remappedJar.flatMap { it.archiveFile }.map { zipTree(it) }) {
            exclude "META-INF/MANIFEST.MF"
        }
    }
    tasks.named("sourcesJar", Jar) {
        from sourceSets[adapter].allSource
    }
}

jar {
    manifest.attributes(["MixinConfigs": "${mod_id}.mixins.json"])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.named("processResources", ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            forge_version    : forge_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : modVersion,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]

    inputs.properties(replaceProperties)

    filesMatching(["META-INF/mods.toml", "pack.mcmeta"]) {
        expand(replaceProperties)
    }
}

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            artifact tasks.named("reobfJar")
            artifact sourcesJar
        }
    }
    repositories {
        maven {
            name = "expandium"
            url = uri("https://repo.expandium.net/releases")
            credentials {
                username = providers.environmentVariable("MAVEN_USERNAME").orNull
                password = providers.environmentVariable("MAVEN_PASSWORD").orNull
            }
        }
    }
}

if (file("dev/dev.gradle").exists()) apply from: "dev/dev.gradle"
