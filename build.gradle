plugins {
    id "java-library"
    id "eclipse"
    id "idea"
    id "maven-publish"
    id "net.neoforged.moddev" version "2.0.148"
}

def modVersion = mod_version
def releaseTag = providers.environmentVariable("RELEASE_TAG").orNull
if (releaseTag) {
    def match = releaseTag =~ /^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)\+(.+)$/
    if (!match.matches() || match.group(2) != minecraft_version) {
        throw new GradleException("Release tag $releaseTag must look like v<version>+$minecraft_version")
    }
    modVersion = match.group(1)
}

group = mod_group_id
version = "${modVersion}+${minecraft_version}"

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets.main.resources {
    srcDir "src/generated/resources"
    exclude ".cache"
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.main
            gameDirectory.set(file("run/client"))
        }

        server {
            server()
            sourceSet = sourceSets.main
            gameDirectory.set(file("run/server"))
            programArgument("--nogui")
        }

        data {
            data()
            sourceSet = sourceSets.main
            gameDirectory.set(file("run/data"))
            programArguments.addAll("--mod", mod_id)
            programArguments.addAll("--all")
            programArguments.addAll("--output", file("src/generated/resources/").absolutePath)
            programArguments.addAll("--existing", file("src/main/resources/").absolutePath)
        }

        configureEach {
            systemProperty("forge.logging.markers", "REGISTRIES")
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

repositories {
    mavenLocal {
        content {
            includeGroup "lu.kolja"
        }
    }
    maven {
        url = "https://repo.expandium.net/releases"
        content {
            includeGroup "lu.kolja"
        }
    }
    maven {
        url = uri("https://cursemaven.com")
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = uri("https://modmaven.dev/")
        content {
            includeGroup "mekanism"
        }
    }
    maven {
        url = uri("https://maven.gtceu.com")
        content {
            includeGroup "com.gregtechceu.gtceu"
        }
    }
    maven {
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup "maven.modrinth"
        }
    }
}

def projectRedNestedJars = tasks.register("projectRedNestedJars", Sync) {
    def jars = configurations.detachedConfiguration(
            dependencies.create("maven.modrinth:project-red-core:4.23.0") { transitive = false },
            dependencies.create("maven.modrinth:project-red-fabrication:4.23.0") { transitive = false })
    from({ jars.collect { zipTree(it) } }) {
        include "META-INF/jarjar/*.jar"
        eachFile { path = name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir("projectred-jarjar")
}

def gtceuNestedJars = tasks.register("gtceuNestedJars", Sync) {
    def jars = configurations.detachedConfiguration(
            dependencies.create("com.gregtechceu.gtceu:gtceu-1.21.1:$gtceu_version") { transitive = false })
    from({ jars.collect { zipTree(it) } }) {
        include "META-INF/jarjar/*.jar"
        eachFile { path = name }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir("gtceu-jarjar")
}

dependencies {
    // we don't want need other mods in our data run
    def dataRun = gradle.startParameter.taskNames.any { it.toLowerCase().contains("rundata") }
    def implement = { String mod ->
        compileOnly(mod) { transitive = false }
        if (!dataRun) {
            runtimeOnly(mod) { transitive = false }
        }
    }

    compileOnly "org.projectlombok:lombok:1.18.32"
    annotationProcessor "org.projectlombok:lombok:1.18.32"

    implement("maven.modrinth:ae2:19.2.18")
    implement("curse.maven:guideme-1173950:8897145")
    implement("com.gregtechceu.gtceu:gtceu-1.21.1:$gtceu_version")
    def gtceuNested = files(gtceuNestedJars).asFileTree.matching { include "*.jar" }
    compileOnly gtceuNested
    if (!dataRun) {
        runtimeOnly gtceuNested
    }
    implement("curse.maven:flux-networks-248020:6089446")
    implement("maven.modrinth:framedblocks:10.6.3")
    implement("curse.maven:laserio-626839:5730007")
    implement("maven.modrinth:codechicken-lib:4.6.1.529")
    implement("maven.modrinth:cb-multipart:3.5.0.155")
    implement("maven.modrinth:project-red-core:4.23.0")
    implement("maven.modrinth:project-red-integration:4.23.0")
    implement("maven.modrinth:project-red-transmission:4.23.0")
    implement("maven.modrinth:project-red-illumination:4.23.0")
    implement("maven.modrinth:project-red-expansion:4.23.0")
    implement("maven.modrinth:project-red-fabrication:4.23.0")
    implement("maven.modrinth:project-red-exploration:4.23.0")
    def projectRedNested = files(projectRedNestedJars).asFileTree.matching { include "*.jar" }
    compileOnly projectRedNested
    if (!dataRun) {
        runtimeOnly projectRedNested
    }
    implement("maven.modrinth:creativecore:2.13.51")
    implement("maven.modrinth:littletiles:1.6.0-pre234")
    implement("curse.maven:domum-ornamentum-527361:7789217")
    implement("mekanism:Mekanism:1.21.1-10.7.19.85")
    implement("mekanism:Mekanism:1.21.1-10.7.19.85:generators")
    implement("maven.modrinth:rechiseled:1.2.6-neoforge-mc1.21")
    implement("maven.modrinth:supermartijn642s-core-lib:1.1.25-neoforge-mc1.21")
    implement("maven.modrinth:supermartijn642s-config-lib:1.1.8-neoforge-mc1.21")
    implement("maven.modrinth:fusion-connected-textures:1.3.16-neoforge-mc1.21.1")

    compileOnly 'org.jetbrains:annotations:26.1.0'

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.5"))

    compileOnly(annotationProcessor("lu.kolja:mixinloadconditions-common:0.2.0"))
    implementation(jarJar("lu.kolja:mixinloadconditions-neoforge:0.2.0"))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.named("processResources", ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            neoforge_version : neoforge_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : modVersion,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]

    inputs.properties(replaceProperties)

    filesMatching(["META-INF/neoforge.mods.toml", "pack.mcmeta"]) {
        expand(replaceProperties)
    }
}

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }
    repositories {
        maven {
            name = "expandium"
            url = uri("https://repo.expandium.net/releases")
            credentials {
                username = providers.environmentVariable("MAVEN_USERNAME").orNull
                password = providers.environmentVariable("MAVEN_PASSWORD").orNull
            }
        }
    }
}

if (file("dev/dev.gradle").exists()) apply from: "dev/dev.gradle"
