name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Use the version of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          minecraft_version=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          tag=$(gh release list --exclude-drafts --limit 100 --json tagName \
            --jq ".[].tagName | select(endswith(\"+$minecraft_version\"))" | sort -V | tail -n 1)
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - run: ./gradlew build

      - name: Check that generated resources are up to date
        run: |
          ./gradlew runData
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            git status --short -- src/generated
            echo "::error::src/generated is out of date: run gradlew runData and commit the result."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: matter_manipulator-${{ github.sha }}
          path: build/libs/*.jar
