name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew build

      - name: Check that generated resources are up to date
        run: |
          ./gradlew runData
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            git status --short -- src/generated
            echo "::error::src/generated is out of date: run gradlew runData and commit the result."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: matter_manipulator-${{ github.ref_name }}-${{ github.sha }}
          path: build/libs/*.jar
