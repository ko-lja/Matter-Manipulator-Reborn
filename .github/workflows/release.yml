name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version from the tag
        run: |
          minecraft_version=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "MINECRAFT_VERSION=$minecraft_version" >> "$GITHUB_ENV"

      - run: ./gradlew build

      - name: Attach the jars to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/libs/*.jar

      - name: Publish to Maven
        if: env.MAVEN_PASSWORD != ''
        run: ./gradlew publish

      - name: Publish to CurseForge
        if: env.CURSEFORGE_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1748833
          curseforge-token: ${{ env.CURSEFORGE_TOKEN }}
          files: build/libs/matter_manipulator-${{ env.VERSION }}.jar
          name: Matter Manipulator ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          loaders: forge
          game-versions: ${{ env.MINECRAFT_VERSION }}
          java: 17

      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: 9UHDa0XE
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: build/libs/matter_manipulator-${{ env.VERSION }}.jar
          name: Matter Manipulator ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          loaders: forge
          game-versions: ${{ env.MINECRAFT_VERSION }}
          java: 17
